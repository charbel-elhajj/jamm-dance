# Trigger a fresh build daily so run-time date comparisons stay current
name: Daily Rebuild Trigger

on:
  schedule:
    # Runs every day at midnight UTC
    - cron: '0 0 * * *'
  workflow_dispatch: # Allow manual triggers from GitHub UI

jobs:
  trigger-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # Update a timestamp marker file so each scheduled run produces a real commit
      - name: Update build trigger timestamp
        run: |
          echo "${{ github.run_number }} ${{ github.run_id }}" > .vercel-trigger
          git add .vercel-trigger
          git commit -m "ci: schedule daily rebuild #${{ github.run_number }}" || exit 0

      - name: Push to main to trigger Vercel auto-deploy
        run: |
          REMOTE_URL="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/charbel-elhajj/jamm-dance.git"
          git push "$REMOTE_URL" HEAD:main
